[pytest]
console_output_style = progress
addopts = -v --tb=short
testpaths = test_case

# ========== 部分为Playwright 迁移新增，上面原有标记不动 ==========
markers =
    login: 登录模块用例
    bus: 大巴票模块用例（bus 标记）
    bus_fields: 大巴票字段填写用例
    bus_confirm: 大巴票提交跳转确认页用例
    selenium: Selenium 引擎用例
    playwright: Playwright 引擎用例
    use_login: 需要登录态，自动注入 Selenium 桥接 Cookie
    ferry: 船票模块用例
    hotel: 酒店套票模块用例
    charter: 包车接送模块用例
    smoke: 冒烟用例

# 后续接 Allure 时，把 addopts 换成这一行：addopts = -v --tb=short --alluredir=reports/allure-results --clean-alluredir